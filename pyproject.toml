[project]
name = "compaszero"
version = "0.11.1"
description = "Cuaderno de rimas para escribir rap. Antes del beat, nace la idea."
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.3",
    "flet-audio==1.1.3",
    "flet-audio-recorder==1.1.3",
    "flet-speech",
    "certifi",
]

[tool.flet]
org = "com.compaszero"
product = "CompásZero"
company = "CompásZero"
copyright = "CompásZero"
# número de versión interno: debe ser mayor que el de las versiones anteriores (Kivy usaba 1024100)
build_number = 2000111
# micrófono: grabar tomas, notas de voz, dictado y freestyle
permissions = ["microphone"]

[tool.flet.app]
path = "src"

[tool.flet.dev_packages]
flet-speech = "extensions/flet-speech"

[tool.flet.splash]
color = "#000000"
dark_color = "#000000"

[tool.flet.android]
# un APK por tipo de procesador: el de tu teléfono pesa mucho menos
split_per_abi = true
# Android 11+: poder usar el servicio de reconocimiento de voz del sistema
[[tool.flet.android.queries.intent]]
action = "android.speech.RecognitionService"

[dependency-groups]
dev = ["pytest"]
